name: ZK BUILDER STOCK

on:
  workflow_dispatch:
    inputs:
      URL:
        description: "OTA PACKAGE URL FOR BUILD"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROM_URL: ${{ github.event.inputs.URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check free disk space
        id: diskcheck
        run: |
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free disk space: ${FREE_GB}GB"
          echo "need_cleanup=$( [ "$FREE_GB" -lt 50 ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Maximize build disk space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'

      - name: Setup build environment
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          sudo apt-get update -qq
          sudo apt-get install -y aria2 \
            openjdk-17-jdk-headless \
            openssh-client p7zip-full \
            python3 python-is-python3 python3-pip \
            zip zipalign > /dev/null 2>&1
          sudo pip install --quiet lz4 zstandard \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib --break-system-packages > /dev/null 2>&1
          
          DATE=$(TZ=Asia/Ho_Chi_Minh date +"%y%m%d")
          ROM_NAME="$(basename "${ROM_URL%%\?*}")"
          DEVICE=""
          ROM_VER=""
          ZK_NAME=""
          IS_PRIVATE_DEVICE="false"
          
          if [[ "$ROM_NAME" == *"-OS"* || "$ROM_NAME" == *"miui_"* ]]; then
            if [[ "$ROM_NAME" =~ ^([a-z0-9]+)-ota_full-(OS[0-9.]+)\.([A-Z0-9]+)-user-([0-9.]+)-.*\.zip$ ]]; then
              DEVICE="${BASH_REMATCH^^}"
              OS_VER="${BASH_REMATCH}"
              REGION="${BASH_REMATCH}"
              ROM_VER="${OS_VER%%.*}"
              ZK_NAME="ZKOS_${DEVICE}_${OS_VER}.${REGION}_CN${DATE}"
            elif [[ "$ROM_NAME" =~ ^([a-z0-9]+)_[a-z_]+-ota_full-(OS[0-9.]+)\.([A-Z0-9]+)-user-([0-9.]+)-.*\.zip$ ]]; then
              DEVICE="${BASH_REMATCH^^}"
              OS_VER="${BASH_REMATCH}"
              REGION="${BASH_REMATCH}"
              ROM_VER="${OS_VER%%.*}"
              ZK_NAME="ZKOS_${DEVICE}_${OS_VER}.${REGION}_MI${DATE}"
            else
              echo "::warning::Cấu trúc tên lạ, đang áp dụng tên mặc định bypass"
              ZK_NAME="ZKOS_XIAOMI_${DATE}"
            fi
          else
            echo "::warning::Tên file không chuẩn, ép dải bypass"
            ZK_NAME="ZKOS_CUSTOM_${DATE}"
          fi
          
          case "${DEVICE,,}" in
            nezha|pandora|pudding|popsicle|myron|byron)
              IS_PRIVATE_DEVICE="true" ;;
          esac
          {
            echo "ZK_NAME=$ZK_NAME"
            echo "DEVICE=${DEVICE,,}"
            echo "ROM_VER=$ROM_VER"
            echo "IS_PRIVATE_DEVICE=$IS_PRIVATE_DEVICE"
          } >> $GITHUB_ENV
          echo "ZK_NAME=$ZK_NAME | DEVICE=${DEVICE,,} | ROM_VER=$ROM_VER | private=$IS_PRIVATE_DEVICE"

      - name: Download ROM files
        run: |
          DEST_DIR="$GITHUB_WORKSPACE/ROM"
          echo "::group::Downloading OTA ROM"
          mkdir -p "$DEST_DIR"
          timeout 9000 aria2c \
            -s16 -x16 -j"$(nproc)" -c \
            -U "Mozilla/5.0" \
            --console-log-level=warn \
            -d "$DEST_DIR" \
            -o "${ZK_NAME}.zip" \
            "$ROM_URL" \
            || { echo "::error::OTA ROM download failed"; exit 1; }
          echo "::endgroup::"
          [ -s "$DEST_DIR/${ZK_NAME}.zip" ] \
            || { echo "::error::Downloaded ROM is missing or empty"; exit 1; }
          echo "Download complete: $(du -h "$DEST_DIR/${ZK_NAME}.zip" | cut -f1)"

      - name: Clone ZK AUTO BUILD sources
        run: |
          ZK_HOME="/home/runner/work/ZK_AUTO_BUILD/ZK_AUTO_BUILD"
          echo "ZK_HOME=$ZK_HOME" >> $GITHUB_ENV
          
          echo "[INFO] - Sao chep truc tiep ma nguon co san tu kho luu tru..."
          mkdir -p "$ZK_HOME"
          
          # Sao chép toàn bộ code hiện tại sang thư mục làm việc nội bộ của tác giả
          cp -r $GITHUB_WORKSPACE/* "$ZK_HOME/" || true
          cp -r $GITHUB_WORKSPACE/.* "$ZK_HOME/" || true
          
          # Di chuyển file ROM tải về vào đúng vị trí cấu trúc yêu cầu
          mkdir -p "$ZK_HOME/ROM"
          mv -f "$GITHUB_WORKSPACE/ROM/${ZK_NAME}.zip" "$ZK_HOME/ROM/${ZK_NAME}.zip"
          sudo chmod -R +x "$ZK_HOME"

      - name: Build ProjectZK ROM
        run: |
          sudo bash "$ZK_HOME/build.sh" "$GITHUB_ENV" "$ZK_NAME"

      - name: Upload ROM as Artifact (Tải trực tiếp)
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-ZKOS-ROM-Output
          path: |
            /home/runner/work/ZK_AUTO_BUILD/ZK_AUTO_BUILD/out/*.zip
          if-no-files-found: error
          retention-days: 7
